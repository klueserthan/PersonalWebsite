# Theme pack: "Agenda"
#
# The site is about political attention — which problems get onto an agenda and
# which are ignored. The palette spends colour the way the subject says
# attention gets spent: almost nothing, then one unmistakable mark.
#
#   ink      #15181c, a blue-black that carries an actual hue
#   paper    #f8f9fa, near-white with a faint blue-grey cast
#   marker   #ffd60a, the accent, applied by hand in zz-custom/style.css
#
# The neutrals lean blue on purpose: it is the accent's complement, so the
# yellow reads as a highlighter laid on office paper rather than as a warm
# editorial ground with a warm accent sitting in it.
#
# `primary` is the ink of each mode, not the marker. Every accent the kit paints
# on its own — nav hover, badges, resume rules — then lands as quiet graphite,
# and the yellow only appears where this design puts it deliberately.

hugoblox:
  meta:
    format: "hugoblox-theme@1"
    name: "Agenda"
    vendor: "klueser"
    version: "2.0.0"
    license: "MIT"

  type: "dual"

  light:
    colors:
      primary: "#15181c"    # ink
      secondary: "#ffd60a"  # marker
      neutral: "#5c646e"    # remaps every text-gray-*/bg-gray-* to a blue-grey
    surfaces:
      background: "#f8f9fa"
      foreground: "#15181c"
      header:
        background: "#f8f9fa"
        foreground: "#15181c"
      footer:
        background: "#f8f9fa"
        foreground: "#5c646e"

  dark:
    colors:
      primary: "#e8eaed"    # ink, inverted
      secondary: "#ffd60a"
      neutral: "#8d959f"
    surfaces:
      background: "#12161b"
      foreground: "#e8eaed"
      header:
        background: "#12161b"
        foreground: "#e8eaed"
      footer:
        background: "#12161b"
        foreground: "#8d959f"
