role: Political Scientist · SNSF Ambizione Grant Holder
bio: |
  I study how political institutions, media, and digital platforms allocate attention —
  which problems get taken up, who has the power to force an issue onto the agenda, and
  what happens to democratic representation when that power shifts outside elected
  institutions. My research spans three connected strands: executive institutions and
  bureaucratic capacity, representation and economic inequality in party systems, and the
  digital reallocation of attention through influencers, platform governance, and
  deepfakes. I hold a PhD in Political Science from Aarhus University and currently lead
  an SNSF Ambizione project at the University of Zurich.

