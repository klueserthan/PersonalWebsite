# Font pack: grotesk display / humanist body / mono data.
#
# Schibsted Grotesk was drawn for a news publisher — an apt display face for
# someone who studies how media allocate attention, and it stays tight and
# quiet at large sizes. IBM Plex Sans keeps long research prose readable, and
# IBM Plex Mono carries the agenda-sheet register: years, venues, and the
# uppercase eyebrows that label each section.
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Klueser"
    style: "sans"
  families:
    heading: "Schibsted Grotesk"
    body: "IBM Plex Sans"
    code: "IBM Plex Mono"
    nav: "IBM Plex Mono"
  weights:
    heading: [600, 500, 700]
    body: [400, 600, 500]
    code: [400, 500]
    nav: [500]
  leading:
    heading: 1.08
    body: 1.68
    code: 1.5
  tracking:
    heading: "-0.022em"
    body: "0"
    caps: "0.09em"
  variable:
    heading: true
    body: false
    code: false
