<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jonathan Klueser">
  <!-- The site's device reduced to one glyph: an agenda of items and the one
       that got attention. Ink rules on paper, one yellow marker laid over by
       hand, sitting low under the item it marks and overrunning its end, the
       way .mark does in the page. Colours are the Agenda theme pack. The
       marked rule stays dark in both modes because text on the marker is
       always ink, and the marker never inverts, so the band has to clear the
       rule on every side: on a dark ground a dark rule with yellow only below
       it loses its top edge to the background. -->
  <style>
    .ink { fill: #15181c }
    @media (prefers-color-scheme: dark) { .ink { fill: #e8eaed } }
  </style>
  <rect class="ink" x="8" y="8"  width="48" height="8"/>
  <rect fill="#ffd60a" x="8" y="20" width="42" height="22"/>
  <rect fill="#15181c" x="8" y="26" width="34" height="8"/>
  <rect class="ink" x="8" y="48" width="40" height="8"/>
</svg>
